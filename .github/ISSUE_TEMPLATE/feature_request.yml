name: Feature Request
description: Suggest an enhancement or new capability for Soroban Lens
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Soroban Lens!
  - type: input
    id: component
    attributes:
      label: Target Component / Package
      description: Which component would this feature belong to? (apps/web, packages/cli, packages/api, packages/ingest, packages/store)
      placeholder: e.g. apps/web
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
