name: Docs site

# Builds the documentation site (#100) from the repo's markdown and the OpenAPI
# spec on every PR, so a broken page fails review, and publishes it to GitHub
# Pages from main.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - 'packages/api/openapi.json'
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # lastUpdated timestamps come from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bash site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
