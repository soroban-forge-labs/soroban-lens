name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Web accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build --workspace @soroban-lens/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit light and dark themes
        run: npm run test:a11y --workspace @soroban-lens/web

  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the floor: `node:sqlite` loses its --experimental-sqlite
        # flag there. Pinning the exact floor is the point — it is what caught
        # this being documented as 22.12. 24 is the current LTS.
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Check web bundle size budget
        run: npm run check:bundle-size -w @soroban-lens/web

      - name: Test all workspaces with coverage
        # Every suite runs against fixtures/testnet-events.json, so CI needs no
        # network access and cannot be broken by a testnet outage.
        #
        # Coverage runs per workspace so each package gets its own summary and
        # its own threshold. Thresholds sit just below current coverage: they
        # can only go up, and a PR that adds untested code fails here.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage"
          failed=0
          for pkg in $(node -e '
            const fs = require("node:fs");
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const dirs = (root.workspaces || []).map((w) => w.replace(/\/$/, ""));
            for (const dir of dirs) {
              const manifest = JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8"));
              if (manifest.scripts && manifest.scripts.test) console.log(manifest.name);
            }
          '); do
            dir=$(node -e '
              const fs = require("node:fs");
              const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const name = process.argv[1];
              for (const w of root.workspaces || []) {
                const dir = w.replace(/\/$/, "");
                const manifest = JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8"));
                if (manifest.name === name) { console.log(dir); break; }
              }
            ' "$pkg")
            echo "::group::Coverage for $pkg"
            set +e
            npm test --workspace "$pkg" -- \
              --experimental-test-coverage \
              --test-coverage-include='src/**' \
              --test-coverage-exclude='**/*.test.*' \
              --test-coverage-exclude='**/test/**' \
              --test-coverage-exclude='**/dist/**' \
              --test-coverage-lines=0 \
              --test-coverage-functions=0 \
              --test-coverage-branches=0 \
              2>&1 | tee "$RUNNER_TEMP/coverage/$pkg.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "$pkg: tests failed"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Enforce per-package coverage thresholds
        # Thresholds are the floor for each package, set just below the
        # coverage at the time they were introduced. Raise them as coverage
        # improves; never lower them to make a PR pass.
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/coverage" <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          // Per-package minimum line coverage (percent).
          const thresholds = {
            "@soroban-lens/cli": 0,
            "@soroban-lens/api": 0,
            "@soroban-lens/core": 0,
            "@soroban-lens/web": 0,
          };

          const dir = process.argv[2];
          const summary = [];
          let failed = false;

          for (const file of fs.readdirSync(dir).filter((f) => f.endsWith(".log")).sort()) {
            const pkg = path.basename(file, ".log");
            const log = fs.readFileSync(path.join(dir, file), "utf8");
            // node --test --experimental-test-coverage prints a table whose
            // "all files" row carries the totals.
            const line = log
              .split("\n")
              .find((l) => /^#?\s*all files\s*\|/.test(l));
            let lines = null;
            if (line) {
              const cells = line.split("|").map((c) => c.trim());
              // Columns: file | line % | branch % | funcs % | ...
              const pct = cells[1] && cells[1].match(/([\d.]+)/);
              if (pct) lines = Number(pct[1]);
            }
            const min = thresholds[pkg];
            if (lines === null) {
              summary.push(`| ${pkg} | n/a | ${min ?? "n/a"} | ⚠️ no coverage table |`);
              continue;
            }
            const ok = min === undefined || lines >= min;
            if (!ok) failed = true;
            summary.push(`| ${pkg} | ${lines.toFixed(2)}% | ${min ?? "n/a"} | ${ok ? "✅" : "❌"} |`);
          }

          const table = [
            "### Test coverage",
            "",
            "| Package | Line coverage | Minimum | Status |",
            "| --- | --- | --- | --- |",
            ...summary,
            "",
          ].join("\n");

          console.log(table);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, table + "\n");
          }
          if (failed) {
            console.error("Coverage dropped below the threshold for at least one package.");
            process.exit(1);
          }
          EOF

      - name: lens doctor finds an unreachable RPC
        # Proves the preflight actually fails rather than passing vacuously.
        # Uses an unresolvable host so the result is identical with or without
        # network egress.
        run: |
          set +e
          node packages/cli/dist/bin.js doctor \
            --rpc-url https://rpc.invalid.soroban-lens-ci \
            --db "$RUNNER_TEMP/ci.db" --data-dir "$RUNNER_TEMP" \
            -c CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected lens doctor to exit 1 on an unreachable RPC, got $code"
            exit 1
          fi

      - name: End to end against the fixture
        run: |
          set -euo pipefail
          DB="$RUNNER_TEMP/e2e.db"
          node packages/cli/dist/bin.js seed --db "$DB"
          node packages/api/dist/bin.js --db "$DB" --port 8080 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          curl -sf --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/health > /dev/null

          COUNT=$(curl -sf "http://127.0.0.1:8080/contracts/CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC/events?limit=50" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).events.length))')

          echo "API returned $COUNT events"
          [ "$COUNT" -gt 0 ] || { echo "expected indexed events from the fixture"; exit 1; }

          # TODO(#201): uncomment once apps/web/test/e2e/ exists:
          # cd apps/web && VITE_API_URL=http://127.0.0.1:8080 npm run build
          # npx playwright test apps/web/test/e2e/ --reporter=dot --trace=on-first-retry

      # Upload Playwright traces on failure (ready for when #201 adds the suite).
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  openapi:
    name: OpenAPI spec lints clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Lint packages/api/openapi.json
        # Ruleset and the two deliberate exceptions are in redocly.yaml.
        # Pinned: @latest meant an unrelated Redocly release could fail this
        # job on a commit that touched nothing. Bump deliberately.
        run: npx --yes @redocly/cli@2.53.2 lint packages/api/openapi.json --format stylish

  client:
    name: Generated client builds against the spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - name: Generate, version-check and build
        # Drift fails here: a spec change the client wrapper no longer fits is
        # a type error, and a spec version bump without a client bump is caught
        # by check-version.
        run: npm run build

  docker:
    name: docker compose builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the API on fixture data
        # The indexer needs live network access, which a CI runner should not
        # depend on. Seeding the committed fixture exercises the same image,
        # the same volume and the same API without reaching the network.
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps -T api node packages/cli/dist/bin.js seed
          docker compose up -d --no-deps api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          # Capture before matching: with pipefail, `curl | grep -q` fails with
          # curl exit 23 when grep exits early on a match.
          health=$(curl -sf http://localhost:8080/health)
          echo "$health"
          grep -q '"status": "ok"' <<<"$health"
          contracts=$(curl -sf "http://localhost:8080/contracts")
          grep -q CDLZFC3S <<<"$contracts"

      - name: Service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
